{% extends 'base.html' %}

{% block title %}Password Reset Complete - AI Interview Pro{% endblock %}

{% block content %}
<div class="form-container">
    <div class="glass-card" style="text-align: center;">
        <div style="font-size: 4rem; color: var(--accent); margin-bottom: 1.5rem;">
            <i class="fas fa-check-circle"></i>
        </div>
        <h2 class="hero-title" style="font-size: 2.5rem; margin-bottom: 0.5rem;">Success!</h2>
        <p class="hero-subtitle" style="margin-bottom: 2rem;">Your password has been reset successfully. You can now log in with your new password.</p>
        
        <a href="{% url 'login' %}" class="btn-primary" style="display: inline-block; text-decoration: none; padding: 0.8rem 2rem;">Sign In Now</a>
    </div>
</div>
{% endblock %}
