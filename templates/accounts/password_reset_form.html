{% extends 'base.html' %}

{% block title %}Reset Password - AI Interview Pro{% endblock %}

{% block content %}
<div class="form-container">
    <div class="glass-card">
        <h2 class="hero-title" style="font-size: 2.5rem; margin-bottom: 0.5rem; text-align: center;">Reset Password</h2>
        <p class="hero-subtitle" style="margin-bottom: 2rem; text-align: center;">Enter your email to receive a password reset link</p>
        
        <form method="POST">
            {% csrf_token %}
            <div class="input-group">
                <label style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Email Address</label>
                <input type="email" name="email" class="input-field" placeholder="Enter your registered email" required>
            </div>
            <button type="submit" class="btn-primary" style="width: 100%; margin-top: 1rem;">Send Reset Link</button>
        </form>

        <div style="text-align: center; margin-top: 2rem; color: var(--text-muted);">
            <p>Remembered your password? <a href="{% url 'login' %}" style="color: var(--primary); text-decoration: none; font-weight: 600;">Sign In</a></p>
        </div>
    </div>
</div>
{% endblock %}
