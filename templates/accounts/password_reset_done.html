{% extends 'base.html' %}

{% block title %}Email Sent - AI Interview Pro{% endblock %}

{% block content %}
<div class="form-container">
    <div class="glass-card" style="text-align: center;">
        <div style="font-size: 4rem; color: var(--primary); margin-bottom: 1.5rem;">
            <i class="fas fa-paper-plane"></i>
        </div>
        <h2 class="hero-title" style="font-size: 2.5rem; margin-bottom: 0.5rem;">Check Your Email</h2>
        <p class="hero-subtitle" style="margin-bottom: 2rem;">We've sent a password reset link to your email address. Please check your inbox (and spam folder).</p>
        
        <a href="{% url 'login' %}" class="btn-primary" style="display: inline-block; text-decoration: none; padding: 0.8rem 2rem;">Back to Login</a>
    </div>
</div>
{% endblock %}
