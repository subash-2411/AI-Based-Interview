<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal | AI Interview Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #09090b;
            --surface-dark: rgba(15, 15, 20, 0.7);
            --surface-border: rgba(255, 255, 255, 0.05);
            --admin-primary: #f43f5e; /* Rose / Red for Admin */
            --admin-secondary: #8b5cf6;
            --admin-accent: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient Background */
        .ambient-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            overflow: hidden;
            background: #000;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.4;
            animation: float 20s infinite ease-in-out alternate;
        }

        .orb-1 {
            width: 45vw;
            height: 45vw;
            background: radial-gradient(circle, var(--admin-primary), transparent 70%);
            top: -20%;
            right: -10%;
        }

        .orb-2 {
            width: 35vw;
            height: 35vw;
            background: radial-gradient(circle, var(--admin-secondary), transparent 70%);
            bottom: -10%;
            left: -10%;
            animation-delay: -5s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(-5%, 5%) scale(1.1); }
            100% { transform: translate(5%, -5%) scale(0.9); }
        }

        /* Main Container */
        .container {
            width: 100%;
            max-width: 1000px;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 1;
        }

        /* Hero Card */
        .hero {
            position: relative;
            background: var(--surface-dark);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--surface-border);
            border-radius: 32px;
            padding: 5rem 3rem;
            text-align: center;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            width: 100%;
            max-width: 700px;
            transform: translateY(20px);
            opacity: 0;
            animation: fadeUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeUp {
            to { transform: translateY(0); opacity: 1; }
        }

        /* Floating Badges for Admin */
        .floating-badge {
            position: absolute;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 0.75rem 1.25rem;
            border-radius: 100px;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 0.9rem;
            font-weight: 600;
            color: #fff;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            animation: float-badge 5s ease-in-out infinite alternate;
            z-index: 10;
        }

        .fb-1 {
            top: -20px;
            left: -30px;
            animation-delay: 0s;
        }
        .fb-1 i { color: #10b981; filter: drop-shadow(0 0 8px rgba(16, 185, 129, 0.5)); }

        .fb-2 {
            bottom: 40px;
            right: -40px;
            animation-delay: -2s;
        }
        .fb-2 i { color: #f43f5e; filter: drop-shadow(0 0 8px rgba(244, 63, 94, 0.5)); }

        @keyframes float-badge {
            0% { transform: translateY(0) rotate(-1deg); }
            100% { transform: translateY(-15px) rotate(1deg); }
        }

        .admin-icon {
            font-size: 3.5rem;
            color: var(--admin-primary);
            margin-bottom: 1.5rem;
            filter: drop-shadow(0 0 15px rgba(244, 63, 94, 0.4));
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 3.5rem;
            font-weight: 900;
            line-height: 1.1;
            margin-bottom: 1rem;
            background: linear-gradient(to right, #fff, #fda4af);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
        }

        p.subtitle {
            font-size: 1.15rem;
            color: var(--text-muted);
            max-width: 500px;
            margin: 0 auto 3rem auto;
            line-height: 1.6;
        }

        /* Launch Button */
        .btn-container {
            position: relative;
            display: inline-block;
        }

        .btn-glow {
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            background: linear-gradient(90deg, var(--admin-primary), var(--admin-secondary), var(--admin-accent), var(--admin-primary));
            background-size: 400% 400%;
            border-radius: 100px;
            z-index: -1;
            filter: blur(15px);
            opacity: 0.6;
            animation: glowAnimation 8s infinite linear;
            transition: opacity 0.3s ease;
        }

        @keyframes glowAnimation {
            0% { background-position: 0% 50%; }
            100% { background-position: 400% 50%; }
        }

        .launch-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            background: rgba(20, 20, 25, 0.8);
            backdrop-filter: blur(10px);
            color: #fff;
            text-decoration: none;
            padding: 1.1rem 3rem;
            border-radius: 100px;
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            font-size: 1.2rem;
            letter-spacing: 0.5px;
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .launch-btn:hover {
            transform: translateY(-2px);
            background: rgba(30, 30, 35, 0.9);
            border-color: rgba(255,255,255,0.3);
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        .launch-btn:hover ~ .btn-glow {
            opacity: 1;
            filter: blur(20px);
        }

        /* Warning text */
        .warning-text {
            margin-top: 3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            font-size: 0.85rem;
            color: var(--text-muted);
            opacity: 0;
            animation: fadeUp 1s ease 0.5s forwards;
        }
        .warning-text i { color: var(--admin-accent); }

        @media (max-width: 768px) {
            h1 { font-size: 2.5rem; }
            .hero { padding: 3rem 1.5rem; }
            .floating-badge { display: none; }
        }
    </style>
</head>
<body>
    <div class="ambient-bg">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
    </div>

    <div class="container">
        <main class="hero">
            <div class="floating-badge fb-1">
                <i class="fas fa-users-cog"></i> User Management
            </div>
            <div class="floating-badge fb-2">
                <i class="fas fa-database"></i> System Logs & Data
            </div>

            <div class="admin-icon">
                <i class="fas fa-shield-halved"></i>
            </div>
            
            <h1>Command Center</h1>
            
            <p class="subtitle">
                Restricted Access. Manage users, monitor interview data, and configure AI engine parameters from the secure admin console.
            </p>

            <div class="btn-container">
                <div class="btn-glow"></div>
                <a href="http://127.0.0.1:8000/admin/" class="launch-btn" id="launchBtn">
                    Access Admin Panel <i class="fas fa-lock"></i>
                </a>
            </div>
        </main>

        <div class="warning-text">
            <i class="fas fa-triangle-exclamation"></i>
            <span>Authorized Personnel Only. Ensure Django server is running.</span>
        </div>
    </div>

    <script>
        document.getElementById('launchBtn').addEventListener('click', function() {
            this.style.transform = 'scale(0.95)';
            setTimeout(() => { this.style.transform = ''; }, 150);
        });
    </script>
</body>
</html>
