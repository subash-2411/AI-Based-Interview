<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#glowGrad)" stroke-width="4" stroke-opacity="0.4"/>
  
  <!-- Outer glowing circle -->
  <circle cx="256" cy="256" r="170" fill="url(#glowGrad)" opacity="0.12" filter="url(#glow)"/>
  
  <!-- Central Brain / AI Icon -->
  <g transform="translate(106, 106) scale(0.5859)" fill="url(#glowGrad)" filter="url(#glow)">
    <path d="M256 64C150 64 64 150 64 256s86 192 192 192 192-86 192-192S362 64 256 64zm0 48c79.5 0 144 64.5 144 144s-64.5 144-144 144S112 335.5 112 256 176.5 112 256 112zm-32 80c-17.7 0-32 14.3-32 32v64c0 17.7 14.3 32 32 32s32-14.3 32-32v-64c0-17.7-14.3-32-32-32zm64 0c-17.7 0-32 14.3-32 32v64c0 17.7 14.3 32 32 32s32-14.3 32-32v-64c0-17.7-14.3-32-32-32z"/>
  </g>

  <!-- Futuristic Sparkles -->
  <circle cx="160" cy="170" r="10" fill="#22d3ee" opacity="0.9" filter="url(#glow)"/>
  <circle cx="350" cy="180" r="8" fill="#f43f5e" opacity="0.9" filter="url(#glow)"/>
  <circle cx="256" cy="380" r="12" fill="#a855f7" opacity="0.9" filter="url(#glow)"/>
  
  <!-- Text Label -->
  <text x="256" y="440" font-family="'Outfit', sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">AI PRO</text>
</svg>
