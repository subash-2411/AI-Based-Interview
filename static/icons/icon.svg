<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Canvas Gradients -->
    <radialGradient id="bgRadial" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="55%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#02040a"/>
    </radialGradient>
    
    <!-- Neon Neural Gradients -->
    <linearGradient id="neonGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="30%" stop-color="#818cf8"/>
      <stop offset="70%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <linearGradient id="neonGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="coreSparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Deep Glow Filters -->
    <filter id="superGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur1"/>
      <feGaussianBlur stdDeviation="28" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base App Squircle Container -->
  <rect width="512" height="512" rx="116" fill="url(#bgRadial)"/>
  
  <!-- Subtle Inner Border Highlight -->
  <rect x="6" y="6" width="500" height="500" rx="110" fill="none" stroke="url(#borderGrad)" stroke-width="3" opacity="0.6"/>

  <!-- Ambient Light Orbs -->
  <circle cx="256" cy="230" r="160" fill="url(#neonGrad2)" opacity="0.16" filter="url(#superGlow)"/>
  <circle cx="160" cy="180" r="80" fill="#06b6d4" opacity="0.2" filter="url(#superGlow)"/>
  <circle cx="350" cy="200" r="90" fill="#ec4899" opacity="0.18" filter="url(#superGlow)"/>

  <!-- ══════════════════════════════════════════════════
       CENTRAL EMBLEM: NEURAL AI BRAIN & INTERVIEW NEXUS
       ══════════════════════════════════════════════════ -->
  <g transform="translate(0, -10)">
    <!-- Circuit Synaptic Arcs (Left Hemisphere) -->
    <path d="M 230 130 C 170 130, 120 175, 120 235 C 120 280, 148 318, 190 338 C 190 365, 215 385, 240 395" 
          fill="none" stroke="url(#neonGrad1)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#superGlow)"/>

    <path d="M 220 165 C 180 165, 150 195, 150 240 C 150 275, 175 305, 210 320" 
          fill="none" stroke="url(#neonGrad2)" stroke-width="6" stroke-linecap="round" stroke-dasharray="16 8" filter="url(#softGlow)"/>

    <!-- Circuit Synaptic Arcs (Right Hemisphere) -->
    <path d="M 282 130 C 342 130, 392 175, 392 235 C 392 280, 364 318, 322 338 C 322 365, 297 385, 272 395" 
          fill="none" stroke="url(#neonGrad1)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#superGlow)"/>

    <path d="M 292 165 C 332 165, 362 195, 362 240 C 362 275, 337 305, 302 320" 
          fill="none" stroke="url(#neonGrad2)" stroke-width="6" stroke-linecap="round" stroke-dasharray="16 8" filter="url(#softGlow)"/>

    <!-- Central Neural Stem & Audio Frequency Wave (Interview Speech Symbol) -->
    <line x1="256" y1="120" x2="256" y2="400" stroke="url(#borderGrad)" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
    
    <!-- Audio / AI Wave Bars -->
    <g fill="url(#coreSparkGrad)" filter="url(#softGlow)">
      <rect x="251" y="195" width="10" height="90" rx="5" fill="url(#neonGrad1)"/>
      <rect x="233" y="215" width="8" height="50" rx="4" fill="url(#neonGrad2)"/>
      <rect x="271" y="215" width="8" height="50" rx="4" fill="url(#neonGrad2)"/>
      <rect x="215" y="230" width="7" height="25" rx="3.5" fill="#38bdf8"/>
      <rect x="290" y="230" width="7" height="25" rx="3.5" fill="#f43f5e"/>
    </g>

    <!-- Synaptic Node Bulbs (Glowing Dots) -->
    <circle cx="230" cy="130" r="9" fill="#38bdf8" filter="url(#superGlow)"/>
    <circle cx="282" cy="130" r="9" fill="#f43f5e" filter="url(#superGlow)"/>
    
    <circle cx="120" cy="235" r="9" fill="#818cf8" filter="url(#superGlow)"/>
    <circle cx="392" cy="235" r="9" fill="#ec4899" filter="url(#superGlow)"/>

    <circle cx="190" cy="338" r="8" fill="#06b6d4" filter="url(#superGlow)"/>
    <circle cx="322" cy="338" r="8" fill="#c084fc" filter="url(#superGlow)"/>

    <circle cx="256" cy="400" r="10" fill="#a855f7" filter="url(#superGlow)"/>

    <!-- Dynamic AI Sparkle Star (Top Center) -->
    <path d="M 256 95 Q 256 125 240 125 Q 256 125 256 155 Q 256 125 272 125 Q 256 125 256 95 Z" 
          fill="url(#coreSparkGrad)" filter="url(#superGlow)"/>
    <circle cx="256" cy="125" r="4" fill="#ffffff"/>
  </g>

  <!-- Bottom Brand Typography (Ultra Crisp) -->
  <g transform="translate(256, 448)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Outfit', 'Inter', sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="6">
      AI INTERVIEW
    </text>
    <text x="0" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Outfit', 'Inter', sans-serif" font-size="12" font-weight="800" fill="#38bdf8" text-anchor="middle" letter-spacing="4" opacity="0.9">
      PRO
    </text>
  </g>
</svg>
